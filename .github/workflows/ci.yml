# Typecheck and test every pull request, including the version bump check.

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun test
      - run: bun run build

      - name: Version is bumped
        env:
          BASE: ${{ github.base_ref }}
        run: |
          head=$(node -p "require('./package.json').version")
          base=$(git show "origin/$BASE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "base $base, this PR $head"
          # Prereleases go out from beta/* branches; main only gets final versions.
          if [ "$BASE" = main ] && [[ "$head" == *-* ]]; then
            echo "::error file=package.json::$head is a prerelease. Set the final version before merging to main."
            exit 1
          fi
          HEAD_VERSION=$head BASE_VERSION=$base bun -e '
            import { compareVersions } from "./src/semver.ts";
            process.exit(compareVersions(String(process.env.HEAD_VERSION), String(process.env.BASE_VERSION)) > 0 ? 0 : 1);
          ' || { echo "::error file=package.json::Bump the version in package.json (base is $base)."; exit 1; }
