<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // An explicit choice wins; otherwise follow the OS setting.
      var stored = null;
      try { stored = localStorage.getItem("token-larper-theme"); } catch {}
      document.documentElement.dataset.theme =
        stored === "dark" || stored === "light"
          ? stored
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      // Style and resolved theme variables were saved by the app (src/client/themes.ts);
      // applying them here, before first paint, avoids a flash of the default theme.
      var root = document.documentElement;
      var appearance = null;
      try { appearance = JSON.parse(localStorage.getItem("token-larper-appearance") || "null"); } catch {}
      var styles = ["grove", "terminal", "paper", "brutal", "soft", "mono"];
      root.dataset.style = appearance && styles.indexOf(appearance.style) >= 0 ? appearance.style : "grove";
      root.dataset.accent = "style";
      try {
        var vars = JSON.parse(localStorage.getItem("token-larper-theme-vars") || "null");
        var current = vars && vars[root.dataset.theme];
        if (current && typeof current === "object") {
          Object.keys(current).forEach(function (name) {
            var value = current[name];
            if (/^--[a-z0-9-]+$/.test(name) && typeof value === "string" && value.length <= 180 && !/[;{}]|url\s*\(/i.test(value)) {
              root.style.setProperty(name, value);
              root.dataset.accent = "custom";
            }
          });
        }
      } catch {}
    </script>
    <meta name="theme-color" content="#f8f9f7" />
    <title>Token Larper — Usage overview</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
